<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>work</title>
    <link rel="stylesheet" href="styles.css">
    <style>

        body.work-page {
            background-image: url('https://picsum.photos/id/1018/1920/1080'); 
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #0a0a0a; /* fallback while image loads */
        }

        /* optional: subtle overlay to improve text readability (keeps elegance) */
        body.work-page::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            pointer-events: none;
            z-index: 0;
        }
        
        /* make sure all interactive content stays above overlay */
        .links-container2,
        .image-grid {
            position: relative;
            z-index: 2;
        }

        /* Image grid - fit all 6 images in viewport without scrolling, preserve aspect ratios */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 80px 20px 20px 20px;
            width: 100vw;
            height: calc(100vh - 80px);
            overflow: hidden;
            align-items: start;
        }

        .grid-item {
            width: 100%;
            height: auto;
            overflow: hidden;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .project-link {
            display: block;
            width: 100%;
            height: auto;
        }

        .grid-item img,
        .grid-item video {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body class="work-page">
    <!-- consistent navigation: home + about (mirrors index style but repositioned for work page) -->
    <div class="links-container2">
        <a href="index.html" class="nav-link">home</a>
        <a href="about.html" class="nav-link">about</a>
    </div>

    <!-- 6‑image grid: each image leads to a distinct page (replace href & image src as needed) -->
    <div class="image-grid">
        <!-- PROJECT 1 -->
        <div class="grid-item">
            <a href="changedetection.html" class="project-link">
                <img src="asserts/Work1.png"  loading="lazy">
            </a>
        </div>
        <!-- PROJECT 2 -->
        <div class="grid-item">
            <a href="computervision.html" class="project-link">
                <img src="asserts/Work2.png" loading="lazy">
            </a>
        </div>
        <!-- PROJECT 3 -->
        <div class="grid-item">
            <a href="yieldprediction.html" class="project-link">
                <img src="asserts/Work3.png" loading="lazy">
            </a>
        </div>
        <!-- PROJECT 4 -->
        <div class="grid-item">
            <a href="suitabilityraster.html" class="project-link">
                <img src="asserts/Work4.png" loading="lazy">
            </a>
        </div>
        <!-- PROJECT 5 -->
        <div class="grid-item">
            <a href="arcgisvisualizations.html" class="project-link">
                <img src="asserts/Work5.jpg" loading="lazy">
            </a>
        </div>
        <!-- PROJECT 6 -->
        <div class="grid-item">
            <a href="changedetection2.html" class="project-link">
                <video src="asserts/Work6.mov" loading="lazy" autoplay muted loop></video>
            </a
        </div>
    </div>

    <!-- 
        HOW TO CUSTOMIZE:
        - background image: edit the url inside <style> block (body.work-page background-image)
        - replace each image src with your own image files or external links
        - change the href attributes to actual project pages (e.g., "works/mountains.html")
        - project titles can be edited directly inside .project-title divs
    -->
</body>
</html>
