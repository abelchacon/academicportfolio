<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>work</title>
    <link rel="stylesheet" href="styles.css">
    <style>

        body.work-page {
            background-image: url('https://picsum.photos/id/1018/1920/1080'); 
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #0a0a0a; /* fallback while image loads */
        }

        /* optional: subtle overlay to improve text readability (keeps elegance) */
        body.work-page::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            pointer-events: none;
            z-index: 0;
        }
        
        /* make sure all interactive content stays above overlay */
        .links-container2 {
            position: relative;
            z-index: 10;
        }

        .image-grid {
            position: relative;
            z-index: 5;
        }

        /* Image grid - scattered layout with small images */
        .image-grid {
            position: relative;
            width: 100vw;
            height: 100vh;
            padding: 0;
            overflow: hidden;
        }

        .grid-item {
            position: absolute;
            width: 150px;
            height: 150px;
            overflow: hidden;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Random positioning using nth-child selectors */
        .grid-item:nth-child(1) {
            top: 15%;
            left: 10%;
            width: 140px;
            height: 140px;
        }

        .grid-item:nth-child(2) {
            top: 25%;
            left: 70%;
            width: 160px;
            height: 160px;
        }

        .grid-item:nth-child(3) {
            top: 55%;
            left: 20%;
            width: 130px;
            height: 130px;
        }

        .grid-item:nth-child(4) {
            top: 40%;
            left: 55%;
            width: 145px;
            height: 145px;
        }

        .grid-item:nth-child(5) {
            top: 70%;
            left: 75%;
            width: 155px;
            height: 155px;
        }

        .grid-item:nth-child(6) {
            top: 60%;
            left: 35%;
            width: 135px;
            height: 135px;
        }

        .project-link {
            display: block;
            width: 100%;
            height: 100%;
        }

        .grid-item img,
        .grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body class="work-page">
    <!-- consistent navigation: home + about (mirrors index style but repositioned for work page) -->
    <div class="links-container2">
        <a href="index.html" class="nav-link">home</a>
        <a href="about.html" class="nav-link">about</a>
    </div>

    <!-- 6‑image grid: each image leads to a distinct page (replace href & image src as needed) -->
    <div class="image-grid">
        <!-- PROJECT 1 -->
        <div class="grid-item">
            <a href="./projects/changedetection.html" class="project-link">
                <img src="asserts/Work1.png"  loading="lazy">
            </a>
        </div>
        <!-- PROJECT 2 -->
        <div class="grid-item">
            <a href="./projects/computervision.html" class="project-link">
                <img src="asserts/Work2.png" loading="lazy">
            </a>
        </div>
        <!-- PROJECT 3 -->
        <div class="grid-item">
            <a href="./projects/yieldprediction.html" class="project-link">
                <img src="asserts/Work3.png" loading="lazy">
            </a>
        </div>
        <!-- PROJECT 4 -->
        <div class="grid-item">
            <a href="./projects/suitabilityraster.html" class="project-link">
                <img src="asserts/Work4.png" loading="lazy">
            </a>
        </div>
        <!-- PROJECT 5 -->
        <div class="grid-item">
            <a href="./projects/arcgisvisualizations.html" class="project-link">
                <img src="asserts/Work5.jpg" loading="lazy">
            </a>
        </div>
        <!-- PROJECT 6 -->
        <div class="grid-item">
            <a href="./projects/changedetection2.html" class="project-link">
                <video src="asserts/Work6.mov" loading="lazy" autoplay muted loop></video>
            </a>
        </div>
    </div>

    <!-- 
        HOW TO CUSTOMIZE:
        - background image: edit the url in the <style> block (body.work-page background-image)
        - replace each image src with your own image files
        - change href attributes to actual project pages
        - adjust grid-item positioning (top, left) in the <style> block for different layouts
        - adjust grid-item sizes (width, height) to make images larger or smaller
    -->
</body>
</html>
